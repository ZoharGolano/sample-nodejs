# Targil2026 - Declarative Argo CD Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ZoharGolano/sample-nodejs.git
    targetRevision: main
    path: helm/sample-nodejs
    helm:
      releaseName: sample-nodejs

  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
